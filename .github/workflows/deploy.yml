name: Deploy ARU Auth

on:
  workflow_dispatch:

concurrency:
  group: aru-auth-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$VPS_HOST" ]] || { echo "Missing secret: VPS_HOST"; exit 1; }
          [[ -n "$VPS_USER" ]] || { echo "Missing secret: VPS_USER"; exit 1; }
          [[ -n "$VPS_SSH_PRIVATE_KEY" ]] || { echo "Missing secret: VPS_SSH_PRIVATE_KEY"; exit 1; }

      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Sync source to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh "$VPS_USER@$VPS_HOST" 'mkdir -p /opt/apps/aru-auth'
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude 'backups/' \
            --exclude 'config/aru-realm.json' \
            ./ "$VPS_USER@$VPS_HOST:/opt/apps/aru-auth/"

      - name: Deploy containers
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh "$VPS_USER@$VPS_HOST" <<'REMOTE'
            set -euo pipefail
            cd /opt/apps/aru-auth
            chmod +x scripts/*.sh scripts/*.py
            ./scripts/deploy.sh
          REMOTE
